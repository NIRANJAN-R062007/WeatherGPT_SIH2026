# Render Blueprint for the WeatherGPT orchestrator (the actual public
# entrypoint today — it serves /ask, /facts, /cities, and the frontend HTML
# itself; see prototype/frontend/WeatherGPT.dc.html's apiBase).
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Every secret env var below is `sync: false` on purpose — Render prompts you
# to paste each value once in its dashboard after the first deploy; nothing
# secret is checked into this file. See .env.example for what each key does.
#
# DATABASE_URL/REDIS_URL are NOT sync:false — they're generated by Render
# itself from the `weathergpt-postgres`/`weathergpt-redis` resources below
# (services/orchestrator/weather_store.py's L2 cache + weather_facts
# persistence, plan.md §8 Phase 1). This blueprint has never been applied
# against a real Render account by this change — verify the first deploy in
# the dashboard before relying on it.

services:
  - type: web
    name: weathergpt-orchestrator
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/orchestrator/Dockerfile
    dockerContext: .
    envVars:
      - key: GOOGLE_WEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OFFLINE_MODE
        value: "0"
      - key: RAG_ENABLED
        value: "1"
      - key: WARNINGS_ENABLED
        value: "0"
      - key: MAX_BODY_BYTES
        value: "2097152"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEATHER_MODE
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: weathergpt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weathergpt-redis
          property: connectionString

  # weather_store.py's L2 cache (SETEX per-kind TTL). Free plan: 25 MB, no
  # persistence guarantee — fine here, since Redis is a cache, not the
  # source of truth (Postgres/the live API are). maxmemoryPolicy matches
  # that: evict least-recently-used keys rather than refuse writes.
  - type: redis
    name: weathergpt-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # private network only — no external Redis access needed

databases:
  # weather_store.py's durable weather_facts history (plan.md §8 Phase 1).
  # Free plan: expires after 30 days and Render will email a warning before
  # that — fine for a hackathon-stage demo; re-provision or upgrade before
  # the finale if this needs to stay up long-term.
  - name: weathergpt-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"

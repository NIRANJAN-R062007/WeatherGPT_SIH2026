# Dependency update PRs (plan.md §8 Phase 8, SEC-N18; finding F10). Scanning
# for known vulnerabilities is .github/workflows/security.yml; this keeps the
# pins moving so there is less to find. Weekly, minor and patch bumps grouped
# per ecosystem to keep the PR count manageable; majors come one by one.
version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /services/orchestrator
      - /services/gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  # Base images (python:3.11-slim). Majors are ignored: a Python 3.x jump is a
  # deliberate upgrade, not a routine bump.
  - package-ecosystem: docker
    directories:
      - /services/orchestrator
      - /services/gateway
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

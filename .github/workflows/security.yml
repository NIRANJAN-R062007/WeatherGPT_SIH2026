# Supply-chain scanning (plan.md §8 Phase 8, SEC-N18; finding F10). Any finding
# fails the job. Dependency *updates* come from .github/dependabot.yml.
#
# gitleaks and Trivy are installed from their GitHub releases at a pinned
# version with the published checksum verified, not via third-party actions:
# this workflow exists to guard the supply chain, so it keeps its own short.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: new CVEs are published against code that hasn't changed.
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  TRIVY_VERSION: "0.74.0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Only the commits being added on push/PR; the whole history on the
      # weekly run, on a manual run, or when a push has no usable "before".
      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD"
          fi
          echo "scanning ${range:-full history}"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose \
            ${range:+--log-opts="$range"}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit orchestrator requirements
        run: pip-audit -r services/orchestrator/requirements.txt --progress-spinner off

      - name: Audit gateway requirements
        run: pip-audit -r services/gateway/requirements.txt --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reads package-lock.json; no install needed. High and critical fail,
      # except advisories accepted by id, with the reason, in the script.
      - name: npm audit
        run: node ../.github/scripts/npm-audit.mjs

  # The same two images publish-images (ci.yml) pushes to GHCR, built here
  # from the same Dockerfiles and scanned before they could ship.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/

      - name: Build images
        run: |
          docker build -t weathergpt-gateway:scan services/gateway
          docker build -f services/orchestrator/Dockerfile -t weathergpt-orchestrator:scan .

      # Fixable HIGH/CRITICAL only: an unfixed CVE has no action to take yet,
      # and the weekly run picks it up once a fix ships.
      - name: Scan images
        run: |
          for image in weathergpt-gateway:scan weathergpt-orchestrator:scan; do
            echo "::group::$image"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done

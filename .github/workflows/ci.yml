name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check services/ ml/ prototype/ --output-format=github

      - name: Python syntax check (all Python packages)
        run: |
          python -m py_compile $(find services ml prototype -name "*.py")

      - name: Install service test deps
        run: pip install -r services/orchestrator/requirements.txt -r services/gateway/requirements.txt

      - name: Run orchestrator tests
        run: pytest services/orchestrator/tests/ -v

      - name: Run gateway tests
        run: pytest services/gateway/tests/ -v

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example (CI only, not a real secret source)
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config

      - name: Build gateway and orchestrator images
        run: docker compose build gateway orchestrator

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Create secret.yaml from example (CI only, not a real secret source)
        run: cp k8s/base/secret.example.yaml k8s/base/secret.yaml

      - name: Render and validate manifests
        run: kubectl kustomize k8s/base | kubeconform -strict -summary -ignore-missing-schemas -

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-syntax, compose-build, k8s-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the repository owner for image tags
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/weathergpt-gateway:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/weathergpt-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/weathergpt-orchestrator:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/weathergpt-orchestrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

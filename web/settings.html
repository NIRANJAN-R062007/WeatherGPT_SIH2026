<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeatherGPT — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/settings.css">
</head>
<body>
<header class="shell" data-shell="settings"></header>

<main class="settings">
  <form class="prefs" id="prefs-form">
    <h1 id="title">Settings</h1>

    <fieldset class="group">
      <legend id="lang-legend">Language</legend>
      <div class="radio-list" id="lang-list"></div>
    </fieldset>

    <fieldset class="group">
      <legend id="unit-legend">Temperature units</legend>
      <div class="segmented" id="unit-seg" role="radiogroup">
        <label><input type="radio" name="unit" value="C" id="unit-c"><span>°C</span></label>
        <label><input type="radio" name="unit" value="F" id="unit-f"><span>°F</span></label>
      </div>
      <p class="hint" id="unit-note"></p>
    </fieldset>

    <fieldset class="group">
      <legend id="backend-legend">Backend</legend>
      <div class="backend">
        <span id="backend-url" class="url"></span>
        <span class="status" id="backend-status" data-state="checking"></span>
      </div>
      <p class="hint" id="backend-hint"></p>
    </fieldset>
  </form>

  <aside class="explainer">
    <h2 id="guardrail-title">How grounding works</h2>
    <ol class="steps" id="steps"></ol>
    <p class="foot-note" id="guardrail-footer"></p>
  </aside>
</main>

<footer class="page-foot" id="foot"></footer>
<script type="module" src="./js/settings.js"></script>
</body>
</html>

# Scrape config for the `docker compose --profile monitoring` stack
# (plan.md §14 observability track). Job names/targets are the compose
# service names on the compose network — not localhost.
global:
  scrape_interval: 5s

scrape_configs:
  # The gateway's /metrics needs a bearer token (METRICS_TOKEN, see
  # docker-compose.yml). The orchestrator's is only reachable on the compose
  # network / :8001 and stays open.
  - job_name: gateway
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8001"]

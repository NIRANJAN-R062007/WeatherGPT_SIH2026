# Scrape config for the `docker compose --profile monitoring` stack
# (plan.md §14 observability track). Job names/targets are the compose
# service names on the compose network — not localhost.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8001"]

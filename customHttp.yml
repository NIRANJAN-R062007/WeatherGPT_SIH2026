# Response headers for the Amplify-hosted frontend (amplify.yml, appRoot
# prototype/frontend). Amplify reads this file from the repo root on each
# build; the monorepo form keys it by appRoot. plan.md SEC-N13 / finding F12.
#
# The CSP must equal PAGE_CSP in services/orchestrator/security_headers.py,
# which sends the same policy when the orchestrator serves this page itself —
# tests/test_security_headers.py checks they match. Why it needs
# 'unsafe-inline'/'unsafe-eval' is explained there.
applications:
  - appRoot: prototype/frontend
    customHeaders:
      - pattern: "**"
        headers:
          - key: Strict-Transport-Security
            value: "max-age=31536000; includeSubDomains"
          - key: X-Content-Type-Options
            value: "nosniff"
          - key: Referrer-Policy
            value: "strict-origin-when-cross-origin"
          - key: Content-Security-Policy
            value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https://3-108-52-61.sslip.io https://bkohiigdngppywnzakvg.supabase.co wss://bkohiigdngppywnzakvg.supabase.co https://unpkg.com https://cdn.jsdelivr.net https://*.ngrok-free.app https://*.ngrok.app http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: weathergpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt_dev
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: weathergpt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: weathergpt-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://weathergpt:weathergpt_dev@postgres:5432/weathergpt
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_URL: http://orchestrator:8001
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Conversation orchestrator (plan.md §4) — the former prototype/ask_service.
  # Reachable directly on :8001 and via the gateway on :8000.

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: weathergpt-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE: ${OLLAMA_BASE:-http://localhost:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    working_dir: /app/services/orchestrator
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Local LLM offline fallback (plan.md §8 Phase 6) — only started with
  # `docker compose --profile offline up`. Point the orchestrator's OLLAMA_BASE at
  # http://ollama:11434 (the compose service name) when using this profile.
  ollama:
    image: ollama/ollama:0.34.0
    container_name: weathergpt-ollama
    profiles: ["offline"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Metrics stack (plan.md §14 observability track) — only started with
  # `docker compose --profile monitoring up`. Scrapes gateway:8000 and
  # orchestrator:8001's /metrics; Grafana comes pre-provisioned with the
  # Prometheus datasource and the WeatherGPT dashboard (monitoring/).
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: weathergpt-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.1
    container_name: weathergpt-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data:

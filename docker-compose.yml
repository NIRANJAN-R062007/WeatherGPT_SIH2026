services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: weathergpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt_dev
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: weathergpt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: weathergpt-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://weathergpt:weathergpt_dev@postgres:5432/weathergpt
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

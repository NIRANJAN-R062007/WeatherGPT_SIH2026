# Copy to secret.yaml (gitignored — see .gitignore) and fill in real values:
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#
# kustomization.yaml references secret.yaml, not this file, so the base
# won't build until that copy exists. Never commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  GOOGLE_WEATHER_API_KEY: ""
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
  BHASHINI_USER_ID: ""
  BHASHINI_ULCA_API_KEY: ""
  BHASHINI_INFERENCE_KEY: ""
  SUPABASE_ANON_KEY: ""
  DATABASE_URL: ""
  REDIS_URL: ""

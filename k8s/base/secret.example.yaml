# Copy to secret.yaml (gitignored — see .gitignore) and fill in real values:
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#
# kustomization.yaml references secret.yaml, not this file, so the base
# won't build until that copy exists. Never commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  GOOGLE_WEATHER_API_KEY: ""
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
  BHASHINI_USER_ID: ""
  BHASHINI_ULCA_API_KEY: ""
  BHASHINI_INFERENCE_KEY: ""
  SUPABASE_ANON_KEY: ""
  # Same demo credentials as docker-compose.yml's postgres service — not a
  # real secret, just kept alongside DATABASE_URL so both stay in sync. Point
  # a real deployment's secret.yaml at real credentials if this ever holds
  # anything beyond the weather_facts cache/history table.
  POSTGRES_USER: "weathergpt"
  POSTGRES_PASSWORD: "weathergpt_dev"
  POSTGRES_DB: "weathergpt"
  # postgres.yaml/redis.yaml (k8s/README.md) provision both in-cluster now —
  # these point at their Service DNS names, not localhost. Override only if
  # pointing at an external managed Postgres/Redis instead.
  DATABASE_URL: "postgresql://weathergpt:weathergpt_dev@postgres.weathergpt.svc.cluster.local:5432/weathergpt"
  REDIS_URL: "redis://redis.weathergpt.svc.cluster.local:6379/0"

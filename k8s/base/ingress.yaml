apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weathergpt
  namespace: weathergpt
  labels:
    app.kubernetes.io/part-of: weathergpt
spec:
  ingressClassName: nginx
  rules:
    - host: weathergpt.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: weathergpt
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: weathergpt
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/niranjan-r062007/weathergpt-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /livez does no I/O (pure liveness check).
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /health touches Postgres/Redis, which are absent in this base
          # manifest (see k8s/README.md) — each check there is independent
          # and the handler always returns 200 with a status dict even when
          # a dependency errors, but give it generous slack anyway in case a
          # DNS lookup or TCP connect to a missing host is slow to fail.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: weathergpt
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000

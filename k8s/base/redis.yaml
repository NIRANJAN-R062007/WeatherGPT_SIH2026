# Redis for services/orchestrator/weather_store.py's L2 weather-snapshot
# cache (plan.md §8 Phase 1) — shared across the orchestrator's replicas,
# unlike its per-pod in-memory L1. Mirrors docker-compose.yml's `redis`
# service (redis:7-alpine). See k8s/README.md.
#
# Deployment, not StatefulSet: it's a pure cache (google_weather.py already
# falls back to a live API call or fixture on a miss), so losing its data on
# a pod restart is harmless — no PVC needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: weathergpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: weathergpt
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: weathergpt
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
